      <!-- Cache status -->

      <!-- Results section -->

          <div id="overview-text">

        </div>

        <h3 class="section-title">Results</h3>

        <div id="cultures-list"></div>

        <!-- Shade Grid Section -->
        <div id="shade-grid-section" class="hidden">
